[project]
name = "tracker-agent"
version = "0.1.0"
description = "AI layer on top of a Google Sheets construction project tracker"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "gspread>=6.1",
    "google-auth>=2.34",
    "anthropic>=0.34",
    "pymupdf>=1.24",
    "typer>=0.12",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
]

[project.scripts]
tracker = "tracker_agent.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracker_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
